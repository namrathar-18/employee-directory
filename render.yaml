services:
  # ── Backend API (Express + MongoDB) ─────────────────────────────────────────
  - type: web
    name: cisogenie-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false          # Set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false          # Set this manually in Render dashboard
      - key: CLIENT_ORIGIN
        sync: false          # Set to your Static Site URL after it's created

  # ── Frontend (Vite React → Static Site) ─────────────────────────────────────
  - type: web
    name: cisogenie-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build:render
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to your Web Service URL after it's created
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
